name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://shipwatch:shipwatch@localhost:5432/shipwatch
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Same containers as `make deps` locally, so CI tests against real Postgres, Redpanda, Redis, Mongo.
      - name: start dependencies
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres redpanda redis mongo
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: pytest
        run: uv run pytest
