services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shipwatch
      POSTGRES_PASSWORD: shipwatch
      POSTGRES_DB: shipwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipwatch -d shipwatch"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      # Containers reach the broker as redpanda:9092, the host as localhost:19092.
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: creates the topics, then exits. Re-running it is harmless.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        create() { rpk topic create "$$1" -p "$$2" -X brokers=redpanda:9092 2>&1 | tee /dev/stderr | grep -qE 'OK|TOPIC_ALREADY_EXISTS'; }
        create pr-events 3
        create pr-events.dlq 1
    depends_on:
      redpanda:
        condition: service_healthy

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  ingester:
    build:
      context: .
      dockerfile: services/ingester/Dockerfile
    env_file: .env
    environment:
      # Inside the compose network Postgres is reachable by service name.
      DATABASE_URL: postgresql+asyncpg://shipwatch:shipwatch@postgres:5432/shipwatch
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://shipwatch:shipwatch@postgres:5432/shipwatch
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FAIL_RATE: ${FAIL_RATE:-0}
      # Static membership (see SPEC_W2). Unique per replica if the worker is ever scaled out.
      CONSUMER_INSTANCE_ID: worker-1
    # SIGTERM -> finish the current message, commit, exit. Give it time before SIGKILL.
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redpanda:
