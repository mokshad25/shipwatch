[project]
name = "shipwatch"
version = "0.1.0"
description = "Shipwatch workspace root"
requires-python = ">=3.12"
dependencies = ["shipwatch-common", "ingester"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/common", "services/ingester"]

[tool.uv.sources]
shipwatch-common = { workspace = true }
ingester = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["libs/common/tests", "services/ingester/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--import-mode=importlib"
