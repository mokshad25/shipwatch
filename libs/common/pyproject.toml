[project]
name = "shipwatch-common"
version = "0.1.0"
description = "Shared settings, database models and helpers for Shipwatch services"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "confluent-kafka>=2.5",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipwatch_common"]
