[project]
name = "worker"
version = "0.1.0"
description = "Kafka consumer that processes pr-events for Shipwatch"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "langchain-anthropic>=1.7",
    "langchain-core>=1.7",
    "langchain-groq>=1.1",
    "langchain-openai>=1.7",
    "pymongo>=4.13",
    "pyyaml>=6.0",
    "shipwatch-common",
]

[project.scripts]
worker = "worker.main:main"

[tool.uv.sources]
shipwatch-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker", "src/agent"]
