[project]
name = "ingester"
version = "0.1.0"
description = "GitHub webhook ingester for Shipwatch"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "shipwatch-common",
]

[tool.uv.sources]
shipwatch-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingester"]
