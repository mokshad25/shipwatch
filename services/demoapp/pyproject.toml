[project]
name = "demoapp"
version = "0.1.0"
description = "Small orders API that Shipwatch watches in the week-4 root-cause demo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "shipwatch-common",
]

[project.scripts]
demoapp-load = "demoapp.load:main"

[tool.uv.sources]
shipwatch-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demoapp"]
